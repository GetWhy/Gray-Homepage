<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阿莫的导航</title>
  <meta name="description" content="个人导航页：爱好、阅读、学习、AI 与工具" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FAF6EE'/%3E%3Ctext x='50' y='69' font-size='52' text-anchor='middle' font-family='serif' fill='%23B4552F'%3E%E8%8E%AB%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("nav-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__img" id="backdropImg"></div>
  </div>
  <div class="page">
    <header class="head">
      <div>
        <h1 id="siteTitle">阿莫的导航</h1>
        <p class="head__sub" id="siteSubtitle">爱好 · 阅读 · 学习 · AI · 工具，一页到位</p>
      </div>
      <div class="head__side">
        <div class="clock">
          <time id="clockTime">--:--</time>
          <span class="clock__date" id="clockDate"></span><span class="clock__term" id="termLabel"></span>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色 / 浅色" title="切换深色 / 浅色">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.4A8.4 8.4 0 1 1 9.6 4a6.6 6.6 0 0 0 10.4 10.4z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="search">
      <svg class="search__icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6"></circle>
        <path d="M10.6 10.6L14 14"></path>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索站点、域名或关键词" autocomplete="off" spellcheck="false" aria-label="搜索站点" />
      <kbd class="search__kbd">/</kbd>
    </div>

    <section class="shelf" id="shelf" aria-label="导航分组"></section>

    <nav class="filters" id="filters" aria-label="分类筛选"></nav>

    <main id="groups"></main>
    <p class="empty" id="empty" hidden>没有匹配的站点。换个关键词，或按 Esc 清空。</p>

    <footer class="foot">
      <span id="footCount"></span>
    </footer>
  </div>

  <script src="./data/links.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
